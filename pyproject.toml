[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "file_quick_signature"
version = "0.0.1"
description = "A quick-change file signature (path, size, mtime_ns) key cache with key reverse-parsing, cross-platform path remapping, and JSON persistence."
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.9"
authors = [
    { name = "Tao Jing", email = "tao.jing.astro@gmail.com" },
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = { find = { where = ["src"] } }
